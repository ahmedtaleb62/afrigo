name: Android Play Store - Taxi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/afrigo_taxi

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.1"
          channel: stable

      - name: Install Flutter dependencies
        run: flutter pub get

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/afrigo_taxi/android

      - name: Restore the real upload keystore (never committed to git)
        working-directory: apps/afrigo_taxi/android
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64_TAXI }}
        run: |
          echo "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
          cat > key.properties <<EOF
          storePassword=${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD_TAXI }}
          keyPassword=${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD_TAXI }}
          keyAlias=afrigo_taxi_upload
          storeFile=upload-keystore.jks
          EOF

      - name: Build and upload to Play Console internal testing
        working-directory: apps/afrigo_taxi/android
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane internal
