name: iOS TestFlight - Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/afrigo_client

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (App Store Connect now requires the iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.1"
          channel: stable

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Flutter build (prepares Generated.xcconfig / DART_DEFINES for Xcode)
        run: flutter build ios --release --no-codesign

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/afrigo_client/ios

      - name: Install CocoaPods dependencies
        working-directory: apps/afrigo_client/ios
        run: pod install

      - name: Build and upload to TestFlight
        working-directory: apps/afrigo_client/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane beta
